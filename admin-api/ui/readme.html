<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vanity Manager — Architecture &amp; Deployment</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap');
    body {
      margin: 0;
      background: #0f0420;
      color: #fff8e7;
      font-family: 'Space Mono', monospace;
      line-height: 1.6;
    }
    .topbar {
      background: #050014;
      padding: 1rem 2rem;
      border-bottom: 3px solid #ff2d95;
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 10;
    }
    .topbar h1 {
      font-family: 'Rubik Mono One', Impact, sans-serif;
      font-size: 1.3rem; color: #ffe500;
      text-transform: uppercase;
      text-shadow: 2px 2px 0 #ff2d95;
    }
    .topbar a {
      background: #ff2d95; color: #050014;
      padding: 0.4rem 0.8rem; text-decoration: none;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.6rem; border: 3px solid #050014;
      box-shadow: 3px 3px 0 #00f0ff; text-transform: uppercase;
      margin-left: 0.4rem;
    }
    .tabs {
      background: #050014;
      padding: 0.5rem 2rem;
      display: flex; gap: 0.4rem; flex-wrap: wrap;
      border-bottom: 2px solid #00f0ff;
    }
    .tab {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.6rem; padding: 0.5rem 0.9rem;
      background: #0f0420; color: #fff8e7;
      border: 2px solid #fff8e7; cursor: pointer;
      text-transform: uppercase;
    }
    .tab.active {
      background: #ffe500; color: #050014;
      border-color: #050014;
      box-shadow: 3px 3px 0 #00f0ff;
    }
    main {
      max-width: 900px; margin: 2rem auto; padding: 0 2rem 4rem;
    }
    main h1, main h2, main h3 {
      color: #ffe500;
      font-family: 'Rubik Mono One', Impact, sans-serif;
      text-transform: uppercase;
      margin: 1.75rem 0 1rem;
    }
    main h1 { font-size: 2rem; text-shadow: 2px 2px 0 #ff2d95; }
    main h2 { font-size: 1.4rem; color: #00f0ff; border-bottom: 2px solid #ff2d95; padding-bottom: 0.3rem; }
    main h3 { font-size: 1.05rem; color: #ff2d95; }
    main p, main li { color: #fff8e7; }
    main a { color: #00f0ff; }
    main code {
      background: #050014; color: #ffe500;
      padding: 0.1rem 0.4rem; border-radius: 3px;
      font-family: 'Space Mono', monospace;
    }
    main pre {
      background: #050014; color: #fff8e7;
      border-left: 4px solid #ff2d95;
      padding: 1rem; overflow-x: auto;
      margin: 1rem 0;
    }
    main pre code { background: none; color: inherit; padding: 0; }
    main blockquote {
      border-left: 4px solid #00f0ff; padding-left: 1rem;
      color: #c6bde0; font-style: italic;
    }

    /* PLAIN MODE overrides */
    body.plain {
      background: #ffffff; color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                   Helvetica, Arial, sans-serif;
    }
    body.plain .topbar {
      background: #f8fafc; border-bottom: 1px solid #cbd5e1;
    }
    body.plain .topbar h1 {
      font-family: inherit; font-size: 1.1rem; font-weight: 600;
      color: #0f172a; text-shadow: none; text-transform: none;
      letter-spacing: 0;
    }
    body.plain .topbar a {
      background: #fff; color: #0f172a; border: 1px solid #cbd5e1;
      box-shadow: none; font-family: inherit; font-size: 0.8rem;
      text-transform: none; padding: 0.35rem 0.7rem; border-radius: 6px;
    }
    body.plain .tabs {
      background: #f8fafc; border-bottom: 1px solid #cbd5e1; padding: 0 2rem;
    }
    body.plain .tab {
      background: transparent; color: #475569; border: none;
      border-bottom: 2px solid transparent;
      font-family: inherit; font-size: 0.9rem; text-transform: none;
      padding: 0.7rem 1rem;
    }
    body.plain .tab.active {
      background: transparent; color: #2563eb; border-color: #2563eb;
      box-shadow: none;
    }
    body.plain main h1, body.plain main h2, body.plain main h3 {
      font-family: inherit; text-transform: none; letter-spacing: -0.01em;
      font-weight: 600;
    }
    body.plain main h1 {
      font-size: 1.85rem; color: #0f172a; text-shadow: none;
    }
    body.plain main h2 {
      font-size: 1.4rem; color: #0f172a; border-bottom: 1px solid #e2e8f0;
      padding-bottom: 0.4rem;
    }
    body.plain main h3 {
      font-size: 1.1rem; color: #334155;
    }
    body.plain main p, body.plain main li { color: #334155; }
    body.plain main a { color: #2563eb; }
    body.plain main code {
      background: #f1f5f9; color: #0f172a;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    body.plain main pre {
      background: #f8fafc; color: #0f172a; border-left: 4px solid #2563eb;
    }
    body.plain main blockquote {
      border-left: 4px solid #cbd5e1; color: #64748b;
    }
    body.plain main th {
      background: #f1f5f9; color: #475569;
      font-family: inherit; font-size: 0.8rem; font-weight: 600;
      letter-spacing: 0; text-transform: none;
    }
    body.plain main td { border-bottom: 1px solid #e2e8f0; }
    .style-toggle {
      background: rgba(255,255,255,0.1); color: var(--paper);
      border: 1px solid rgba(255,255,255,0.2); border-radius: 4px;
      padding: 0.35rem 0.7rem; font-size: 0.8rem;
      font-family: 'Space Mono', monospace; text-decoration: none;
      margin-left: 0.4rem;
    }
    body.plain .style-toggle {
      background: #fff; color: #475569; border-color: #cbd5e1;
      font-family: inherit;
    }
    main table {
      width: 100%; border-collapse: collapse; margin: 1rem 0;
    }
    main th {
      background: #ff2d95; color: #050014; padding: 0.5rem;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.65rem; text-transform: uppercase;
    }
    main td {
      padding: 0.5rem; border-bottom: 1px dashed #00f0ff;
    }
    main ul, main ol { padding-left: 1.5rem; }
    #content { min-height: 50vh; }
  </style>
</head>
<body>

<div class="topbar">
  <h1>Architecture &amp; Deployment</h1>
  <div>
    <a id="lnk-admin" href="/api/v1/ui">Admin</a>
    <a id="lnk-api" href="/api/v1/docs">API</a>
    <a id="styleToggle" class="style-toggle" href="#">style</a>
  </div>
</div>

<div class="tabs" id="tabs">
  <button class="tab active" data-doc="readme">README</button>
  <button class="tab" data-doc="decisions">Decisions (ADRs)</button>
  <button class="tab" data-doc="scope">Scope</button>
  <button class="tab" data-doc="ds2">DS2 Beacon</button>
</div>

<main>
  <div id="content">Loading…</div>
</main>

<script>
// Style toggle (must run before content swaps so labels render correctly)
const STYLE = (function () {
  const u = new URLSearchParams(location.search);
  const param = (u.get('zoolander') || u.get('style') || '').toLowerCase();
  const cookieIsZoo = document.cookie.split(';').some(
    (c) => c.trim() === 'vm-style=zoolander'
  );
  let isZoo;
  if (['on', '1', 'true', 'zoolander'].includes(param)) {
    isZoo = true;
    document.cookie = 'vm-style=zoolander; Path=/; Max-Age=2592000; SameSite=Lax';
  } else if (['off', '0', 'false', 'plain'].includes(param)) {
    isZoo = false;
    document.cookie = 'vm-style=; Path=/; Max-Age=0; SameSite=Lax';
  } else {
    isZoo = cookieIsZoo;
  }
  const isPlain = !isZoo;
  if (isPlain) {
    document.body.classList.add('plain');
    document.title = 'Vanity Manager — Architecture & Deployment';
  }
  const toggle = document.getElementById('styleToggle');
  if (toggle) {
    toggle.textContent = isZoo ? 'zoolander' : 'plain';
    toggle.addEventListener('click', (ev) => {
      ev.preventDefault();
      const u = new URL(location.href);
      u.searchParams.set('zoolander', isZoo ? 'off' : 'on');
      location.href = u.toString();
    });
  }
  return isZoo ? 'zoolander' : 'plain';
})();

const TOKEN = new URLSearchParams(location.search).get('token') || '';
const isZooNav = !document.body.classList.contains('plain');
const navParams = [];
if (TOKEN) navParams.push('token=' + encodeURIComponent(TOKEN));
if (isZooNav) navParams.push('zoolander=on');
const navQs = navParams.length ? '?' + navParams.join('&') : '';

// Stamp token + style onto the topbar backlinks.
for (const id of ['lnk-admin', 'lnk-api']) {
  const a = document.getElementById(id);
  if (a && navQs) a.href = a.getAttribute('href') + navQs;
}

const DOCS = {
  readme:    '/api/v1/docs/source/readme',
  decisions: '/api/v1/docs/source/decisions',
  scope:     '/api/v1/docs/source/scope',
  ds2:       '/api/v1/docs/source/ds2',
};

async function load(doc) {
  document.getElementById('content').textContent = 'Loading…';
  try {
    const resp = await fetch(DOCS[doc]);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const md = await resp.text();
    document.getElementById('content').innerHTML = marked.parse(md);
  } catch (e) {
    document.getElementById('content').innerHTML =
      '<p style="color:#ff3b3b">Error loading doc: ' + e.message + '</p>';
  }
}

document.querySelectorAll('.tab').forEach((t) => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach((x) => x.classList.remove('active'));
    t.classList.add('active');
    load(t.dataset.doc);
  });
});

load('readme');
</script>
</body>
</html>
