<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
     role="img" aria-labelledby="title desc">
  <title id="title">Vanity Manager Features</title>
  <desc id="desc">Three feature pillars: scale capacity (100K+ rules, 4200 edge locations, sub-5ms p95 latency), telemetry (DataStream 2 captures every request with rule provenance), and a fully serverless deployment shape (no VMs, databases, or clusters).</desc>

  <rect width="1000" height="720" fill="#ffffff"/>

  <text x="500" y="52" text-anchor="middle" font-size="22" font-weight="600" fill="#0f172a">
    Forward-deployed mode
  </text>
  <text x="500" y="78" text-anchor="middle" font-size="13" fill="#64748b">
    Same control plane, redirect serving moves to every Akamai location
  </text>

  <!-- SCALE -->
  <g transform="translate(40 130)">
    <rect x="0" y="0" width="290" height="500" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="290" height="48" fill="#1e3a8a"/>
    <text x="145" y="32" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">Scale</text>

    <text x="145" y="125" text-anchor="middle" font-size="46" font-weight="700" fill="#0f172a">100,000+</text>
    <text x="145" y="148" text-anchor="middle" font-size="12" fill="#475569">rules per deployment</text>

    <line x1="30" y1="180" x2="260" y2="180" stroke="#cbd5e1"/>

    <text x="145" y="220" text-anchor="middle" font-size="36" font-weight="700" fill="#0f172a">4,200</text>
    <text x="145" y="242" text-anchor="middle" font-size="12" fill="#475569">Akamai edge locations</text>

    <line x1="30" y1="275" x2="260" y2="275" stroke="#cbd5e1"/>

    <text x="145" y="320" text-anchor="middle" font-size="36" font-weight="700" fill="#0f172a">&lt;5 ms</text>
    <text x="145" y="342" text-anchor="middle" font-size="12" fill="#475569">p95 redirect latency</text>

    <line x1="30" y1="375" x2="260" y2="375" stroke="#cbd5e1"/>

    <text x="145" y="410" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">No per-policy cap</text>
    <text x="145" y="432" text-anchor="middle" font-size="12" fill="#475569">vs. Cloudlet's ~5K limit</text>
    <text x="145" y="468" text-anchor="middle" font-size="11" fill="#94a3b8" font-style="italic">tall and wide rule shapes</text>
  </g>

  <!-- TELEMETRY -->
  <g transform="translate(355 130)">
    <rect x="0" y="0" width="290" height="500" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="290" height="48" fill="#1e3a8a"/>
    <text x="145" y="32" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">Telemetry</text>

    <text x="145" y="120" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Every request</text>
    <text x="145" y="148" text-anchor="middle" font-size="12" fill="#475569">captured by DataStream 2</text>

    <line x1="30" y1="180" x2="260" y2="180" stroke="#cbd5e1"/>

    <text x="145" y="210" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Destinations</text>
    <text x="145" y="232" text-anchor="middle" font-size="12" fill="#475569">ClickHouse · Hydrolix</text>
    <text x="145" y="250" text-anchor="middle" font-size="12" fill="#475569">S3 · Splunk · Datadog</text>

    <line x1="30" y1="280" x2="260" y2="280" stroke="#cbd5e1"/>

    <text x="145" y="310" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Rule provenance</text>
    <text x="145" y="335" text-anchor="middle" font-size="11" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">X-Vanity-Manager</text>
    <text x="145" y="353" text-anchor="middle" font-size="11" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">X-Vanity-Match-Type</text>
    <text x="145" y="371" text-anchor="middle" font-size="11" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">X-Vanity-Src-Path</text>
    <text x="145" y="389" text-anchor="middle" font-size="11" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">X-Vanity-Target</text>

    <line x1="30" y1="420" x2="260" y2="420" stroke="#cbd5e1"/>

    <text x="145" y="453" text-anchor="middle" font-size="12" fill="#475569">Live admin counters in UI</text>
    <text x="145" y="473" text-anchor="middle" font-size="11" fill="#94a3b8" font-style="italic">no dashboard required</text>
  </g>

  <!-- SERVERLESS -->
  <g transform="translate(670 130)">
    <rect x="0" y="0" width="290" height="500" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="290" height="48" fill="#1e3a8a"/>
    <text x="145" y="32" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">Fully serverless</text>

    <text x="145" y="135" text-anchor="middle" font-size="64" font-weight="700" fill="#0f172a">0</text>
    <text x="145" y="165" text-anchor="middle" font-size="12" fill="#475569">VMs · databases · clusters</text>

    <line x1="30" y1="195" x2="260" y2="195" stroke="#cbd5e1"/>

    <text x="145" y="225" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Control plane</text>
    <text x="145" y="247" text-anchor="middle" font-size="12" fill="#475569">Akamai Functions</text>
    <text x="145" y="265" text-anchor="middle" font-size="11" fill="#94a3b8" font-style="italic">Spin / Rust / Wasm</text>

    <line x1="30" y1="290" x2="260" y2="290" stroke="#cbd5e1"/>

    <text x="145" y="320" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Data plane</text>
    <text x="145" y="342" text-anchor="middle" font-size="12" fill="#475569">EdgeWorkers + EdgeKV</text>
    <text x="145" y="360" text-anchor="middle" font-size="11" fill="#94a3b8" font-style="italic">runs at every Akamai PoP</text>

    <line x1="30" y1="385" x2="260" y2="385" stroke="#cbd5e1"/>

    <text x="145" y="415" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Source of truth</text>
    <text x="145" y="437" text-anchor="middle" font-size="12" fill="#475569">Object Storage</text>
    <text x="145" y="455" text-anchor="middle" font-size="11" fill="#94a3b8" font-style="italic">~$5/mo, snapshots only</text>

    <line x1="30" y1="478" x2="260" y2="478" stroke="#cbd5e1"/>

    <text x="145" y="498" text-anchor="middle" font-size="11" fill="#94a3b8" font-style="italic">no patching · no HA setup</text>
  </g>

  <text x="500" y="690" text-anchor="middle" font-size="12" fill="#64748b">
    Rule changes propagate end-to-end in 5–10 seconds, no property activation
  </text>
</svg>
