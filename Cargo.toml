[workspace]
members = ["shared", "redirect-handler", "admin-api", "reconcile-worker"]
resolver = "2"

[workspace.dependencies]
spin-sdk = "5.2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
url = "2"
base64 = "0.22"
rand = "0.8"
futures = { version = "0.3", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "s"
lto = true
